name: battleship

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-battleship}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-battleship}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-0.2}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-0.5}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-500}
  DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-200}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-battleship}
      POSTGRES_USER: ${POSTGRES_USER:-battleship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 2s
      retries: 20

  migrate:
    build: .
    environment: *app-env
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=1)"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  postgres_data:
